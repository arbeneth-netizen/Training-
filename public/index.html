<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notizheft</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- Als App auf dem Home-Bildschirm -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notizheft">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2c2c2e" media="(prefers-color-scheme: dark)">
  <script>
    // Dark Mode sofort setzen, damit nichts hell aufblitzt
    try {
      const t = JSON.parse(localStorage.getItem("nh-theme") || "{}");
      const dark = t.t === "dark" || ((t.t || "auto") === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch {}
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="sidebarToggle" title="Seitenleiste">☰</button>
    <div class="brand">Notizheft</div>
    <div class="topbar-spacer"></div>
    <label class="semester-picker" title="Semester wechseln">
      <select id="semesterSelect"></select>
    </label>
    <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙︎</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <div class="toast-area" id="toasts"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
